name: E2E

# Affan (Sprint 0–1): Playwright against the whole stack started with Docker Compose.
# Smoke on every push to main and every PR; the Sprint 1 exit flow (code → join → upload) runs too.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          chmod -R a+rwX frontend
          docker compose up -d --build db redis migrate backend worker frontend
      - name: Wait for the API and the dev server
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 5
          done
          docker compose logs backend frontend
          exit 1
      - name: Seed the demo workspace
        run: docker compose exec -T backend python -m app.cli seed-demo

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000
        run: npx playwright test

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
