name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

env:
  # PyTorch (a sentence-transformers dependency) defaults to its ~2 GB CUDA build on Linux.
  # These CI runners have no GPU, so every install step below pulls torch from PyTorch's own
  # CPU-only index first; pip then treats it as already satisfied when it processes the rest
  # of requirements.txt. Keep this in sync with backend/Dockerfile, which does the same thing.
  PIP_TORCH_CPU: "pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3'"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          eval "$PIP_TORCH_CPU"
          pip install -r requirements.txt -r requirements-dev.txt --break-system-packages
      - name: Run ruff (lint)
        run: ruff check .
      - name: Run ruff (format check)
        run: ruff format --check .
      - name: Run mypy (type check)
        run: mypy app

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: requirements_conflict_detector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A single, disposable database — no "_test" suffix trick needed like local dev, since
      # the service container is already exclusive to this job. See tests/conftest.py.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/requirements_conflict_detector_test
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_DB: "1"  # a skipped integration test here is a red flag, not a pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          eval "$PIP_TORCH_CPU"
          pip install -r requirements.txt -r requirements-dev.txt --break-system-packages
      - name: Check there is exactly one Alembic head
        run: alembic heads | tee /tmp/heads.txt && [ "$(wc -l < /tmp/heads.txt)" -eq 1 ]
      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          eval "$PIP_TORCH_CPU"
          pip install -r requirements.txt pip-audit --break-system-packages
      - name: Audit dependencies for known vulnerabilities
        # Sprint 0: report only, so a new CVE in some transitive dependency can't block
        # everyone's PRs. Tighten to a hard failure once the team has a patching rhythm.
        run: pip-audit -r requirements.txt --progress-spinner=off || echo "::warning::pip-audit found issues — see log above"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image (build check only, not pushed)
        working-directory: .
        run: docker build -t backend-ci-check ./backend
