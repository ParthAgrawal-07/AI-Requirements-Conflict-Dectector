name: Backend CI

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt --break-system-packages
          pip install -r requirements-dev.txt --break-system-packages
      - name: Run ruff (lint)
        run: |
          cd backend
          ruff check .
      - name: Run mypy (type check)
        run: |
          cd backend
          mypy app

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt --break-system-packages
      - name: Run tests
        run: |
          cd backend
          pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image (build check only, not pushed)
        run: docker build -t backend-ci-check ./backend
