name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        # Using `npm install` rather than `npm ci` here deliberately: the committed
        # lockfile was generated on Windows, and npm has a known bug (npm/cli#4828)
        # where Windows-generated lockfiles don't reliably record the Linux-specific
        # optional native binary Rollup needs. `npm install` re-resolves platform-
        # correct optional deps at install time instead of trusting the lockfile blindly.
        run: |
          cd frontend
          npm install
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint
      - name: Run TypeScript type check
        run: |
          cd frontend
          npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Run tests
        run: |
          cd frontend
          npm run test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend Docker image (build check only, not pushed)
        run: docker build -t frontend-ci-check ./frontend
