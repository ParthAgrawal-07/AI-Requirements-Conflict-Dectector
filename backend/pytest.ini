[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -m "not llm"
markers =
    unit: fast, isolated unit tests
    integration: needs a real PostgreSQL (+pgvector) and Redis — run `pytest -m "not integration"` to skip
    llm: calls a real LLM API — excluded from default runs
    slow: long-running tests
