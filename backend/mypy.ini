[mypy]
python_version = 3.11
ignore_missing_imports = True
; Deliberately lenient for now: parts of the codebase are still stubs. Tighten these
; (e.g. disallow_untyped_defs = True) once real implementations land, per module,
; rather than turning it on globally and blocking every PR immediately.
disallow_untyped_defs = False
warn_unused_ignores = True
exclude = (tests/|alembic/)

; Role 5 (Backend API & Orchestration) modules are fully typed from day one.
[mypy-app.core.*,app.api.*,app.models.*,app.schemas.*,app.services.*,app.cli]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
no_implicit_optional = True
