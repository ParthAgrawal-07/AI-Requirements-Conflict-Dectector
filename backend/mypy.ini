[mypy]
python_version = 3.11
ignore_missing_imports = True
; Deliberately lenient for now: the codebase is mostly stubs. Tighten these
; (e.g. disallow_untyped_defs = True) once real implementations land, per module,
; rather than turning it on globally and blocking every PR immediately.
disallow_untyped_defs = False
warn_unused_ignores = True
exclude = (tests/|alembic/)
